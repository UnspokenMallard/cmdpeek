# Pack a zip with scripts/New-CmdPeekReleaseArchive.ps1 -UpdateManifest
# (or tag a release) so InstallerUrl/InstallerSha256 match a GitHub asset.
#
# Until the zip is attached to a GitHub release, install with:
#   irm https://raw.githubusercontent.com/UnspokenMallard/cmdpeek/main/install.ps1 | iex
# or from a clone:
#   .\install.ps1

