name: release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      attach_tag:
        description: 'Existing release tag to pack and attach (e.g. 0.2.0)'
        required: false
        type: string

jobs:
  archive:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CMDPEEK_RELEASE_TAG: ${{ github.event.inputs.attach_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.attach_tag || github.ref }}
      - name: Build portable zip
        shell: pwsh
        run: |
          ./scripts/New-CmdPeekReleaseArchive.ps1 -OutputDirectory ./dist -UpdateManifest
          Copy-Item ./scoop/cmdpeek.json ./dist/ -Force
          Copy-Item ./winget/manifest.yaml ./dist/ -Force
      - uses: actions/upload-artifact@v4
        with:
          name: cmdpeek-win-x64
          path: |
            dist/*.zip
            dist/*.json
            dist/manifest.yaml
      - name: Attach zip to GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.CMDPEEK_RELEASE_TAG }}
          files: |
            dist/*.zip
            dist/*.json
            dist/manifest.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
